// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.5.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    configurations.configureEach {
        resolutionStrategy {
            // Force a version of androidx.browser:browser compatible with compileSdk 35 and AGP 8.7.2
            // version 1.9.0 requires compileSdk 36 and AGP 8.9.1+
            force "androidx.browser:browser:$rootProject.ext.androidxBrowserVersion"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
