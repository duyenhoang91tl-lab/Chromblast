# Build Android cho ChromaBlast trên GitHub Actions (runner có sẵn Android SDK).
# - Luôn build: APK debug (cài thử trực tiếp lên máy) + AAB release.
# - Nếu repo có đủ 4 secret ký app thì AAB được KÝ sẵn sàng upload CH Play:
#     KEYSTORE_BASE64   (file .jks/.keystore mã hoá base64: `base64 -w0 my.keystore`)
#     KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#   Chưa có secret → vẫn build AAB chưa ký (Play không nhận; dùng để kiểm tra).
name: Build Android

on:
  push:
    branches: [main]
    paths: ['index.html', 'main.css', 'js/**', 'maps/**', 'fonts/**', 'android/**', 'capacitor.config.json', 'package.json', '.github/workflows/android-build.yml']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Install deps & sync web assets
        run: |
          npm ci
          npm run build:www
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Decode keystore (nếu có secret)
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore

      - name: Build release AAB (ký nếu có keystore)
        working-directory: android
        run: |
          if [ -f app/release.keystore ]; then
            ./gradlew bundleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$PWD/app/release.keystore" \
              -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
              -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
              -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"
          else
            ./gradlew bundleRelease --no-daemon
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chromablast-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: chromablast-release-aab
          path: android/app/build/outputs/bundle/release/app-release*.aab
