name: Deploy Firebase Functions + Firestore Rules

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-functions-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        working-directory: functions
        run: npm install

      - name: Write service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/gcp-sa.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHROMBLAST_5CF77 }}

      - name: Deploy Cloud Functions + Firestore rules
        run: |
          set +e
          npx firebase-tools deploy --only functions,firestore:rules \
            --project chromblast-5cf77 --non-interactive --debug \
            2>&1 | tee /tmp/deploy.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "::group::Toan bo log deploy"
            cat /tmp/deploy.log
            echo "::endgroup::"
            ERR1=$(grep -iE 'error|failed|denied|exception' /tmp/deploy.log | grep -viE 'npm warn|deprecated' | tail -n 40)
            MSG=$(printf '%s' "$ERR1" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\r/%0D/g;s/\n/%0A/g' | cut -c1-3800)
            echo "::error title=Firebase deploy - dong co chu error/failed::$MSG"
            if [ -f firebase-debug.log ]; then
              echo "::group::firebase-debug.log"
              cat firebase-debug.log
              echo "::endgroup::"
              ERR2=$(grep -iE 'error|failed|denied|exception' firebase-debug.log | tail -n 40)
              MSG2=$(printf '%s' "$ERR2" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\r/%0D/g;s/\n/%0A/g' | cut -c1-3800)
              echo "::error title=firebase-debug.log - dong co chu error/failed::$MSG2"
            fi
            TAIL=$(tail -n 20 /tmp/deploy.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\r/%0D/g;s/\n/%0A/g' | cut -c1-3800)
            echo "::warning title=20 dong cuoi deploy.log (du phong neu khong co dong nao khop error)::$TAIL"
          fi
          exit $code
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-sa.json
          FORCE_COLOR: "0"

      - name: Clean up credentials
        if: always()
        run: rm -f /tmp/gcp-sa.json
