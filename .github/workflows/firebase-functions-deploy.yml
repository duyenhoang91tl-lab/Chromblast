name: Deploy Firebase Functions + Firestore Rules

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-functions-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        working-directory: functions
        run: npm install

      - name: Write service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/gcp-sa.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHROMBLAST_5CF77 }}

      - name: Deploy Cloud Functions + Firestore rules
        run: |
          set +e
          npx firebase-tools deploy --only functions,firestore:rules \
            --project chromblast-5cf77 --non-interactive --debug \
            2>&1 | tee /tmp/deploy.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "::group::Toan bo log deploy (de doc thu cong neu can)"
            cat /tmp/deploy.log
            echo "::endgroup::"
            MSG=$(tail -n 150 /tmp/deploy.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Firebase deploy that bai (50 dong cuoi)::$MSG"
            if [ -f firebase-debug.log ]; then
              echo "::group::firebase-debug.log (chi tiet ky thuat)"
              cat firebase-debug.log
              echo "::endgroup::"
              MSG2=$(tail -n 120 firebase-debug.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\r/%0D/g;s/\n/%0A/g')
              echo "::error title=firebase-debug.log (40 dong cuoi)::$MSG2"
            fi
          fi
          exit $code
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-sa.json
          FORCE_COLOR: "0"

      - name: Clean up credentials
        if: always()
        run: rm -f /tmp/gcp-sa.json
