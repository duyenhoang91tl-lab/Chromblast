# Deploy THỦ CÔNG (chỉ chạy khi tự bấm "Run workflow" trong tab Actions, KHÔNG
# tự chạy mỗi khi push) lên Firebase Hosting, project "chromblast-5cf77"
# (xem .firebaserc). Theo đúng firebase.json: hosting.public = "legal", nên
# workflow này CHỈ đăng 2 trang tĩnh privacy-policy.html + terms-of-service.html
# — không đụng tới game chính (game chính deploy qua GitHub Pages, xem pages.yml).
#
# CẦN LÀM 1 LẦN TRƯỚC KHI DÙNG:
#   1. Firebase Console → Project settings → Service accounts → Generate new
#      private key → tải file JSON về.
#   2. Vào repo GitHub → Settings → Secrets and variables → Actions → New
#      repository secret, đặt tên đúng:
#        FIREBASE_SERVICE_ACCOUNT_CHROMBLAST_5CF77
#      giá trị dán NGUYÊN VĂN nội dung file JSON vừa tải.
#   3. (Tuỳ chọn) đổi projectId/channelId bên dưới nếu sau này thêm project
#      hoặc kênh preview khác.
#
# CÁCH CHẠY: tab Actions trên GitHub → chọn "Deploy Firebase Hosting (thủ công)"
# ở cột trái → nút "Run workflow".

name: Deploy Firebase Hosting (thủ công)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy lên Firebase Hosting (kênh live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHROMBLAST_5CF77 }}
          projectId: chromblast-5cf77
          channelId: live
