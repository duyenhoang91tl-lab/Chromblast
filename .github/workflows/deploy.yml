# Tự động build bản web đã minify (www/) và đăng toàn bộ game lên GitHub Pages
# mỗi khi push lên main. Sau khi chạy:
#   https://<owner>.github.io/<repo>/                      ← chơi game trên web
#   https://<owner>.github.io/<repo>/privacy-policy.html   ← dùng cho Play Console
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ cho phép 1 bản deploy Pages chạy tại 1 thời điểm — push mới sẽ hủy bản cũ.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài dependency & build web (JS/CSS đã minify qua esbuild)
        run: |
          npm ci
          npm run build:www

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # tự bật Pages cho repo nếu chưa bật

      - name: Đóng gói thư mục www/ làm artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./www

      - name: Deploy lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
