<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChromaBlast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="start-screen" role="dialog" aria-modal="true" aria-hidden="false">
    <div class="start-bg"></div>
    <div class="start-stars" id="start-stars" aria-hidden="true"></div>
    <div class="start-content">
      <div class="start-logo">
        <span class="logo-chroma">CHROMA</span><span class="logo-blast">BLAST</span>
      </div>
      <div class="start-subtitle">🎮 Phá màu · Khám phá · Chinh phục</div>
      <div class="start-chars">🟥🟧🟨🟩🟦🟪</div>
      <button id="start-btn" class="start-btn" type="button" aria-label="Bắt đầu chơi">▶ BẮT ĐẦU CHƠI</button>
      <div class="start-hint">Chạm hoặc nhấp để bắt đầu</div>
    </div>
  </div>

  <div id="auth-screen" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="start-bg"></div>
    <div class="auth-card" role="document">
      <div class="auth-logo"><span class="logo-chroma">CHROMA</span><span class="logo-blast">BLAST</span></div>
      <div class="auth-sub">🔐 Đăng nhập để bắt đầu chơi</div>
      <button type="button" id="guest-play-btn" class="auth-submit-btn" style="background:linear-gradient(135deg,#56AB2F,#A8E063);margin-bottom:16px;">▶ CHƠI NGAY (KHÔNG CẦN ĐĂNG NHẬP)</button>
      <div class="auth-switch" style="margin-bottom:10px;">— hoặc —</div>

      <form id="login-form" class="auth-form active">
        <div class="auth-field">
          <label for="login-username">Tên đăng nhập</label>
          <input type="text" id="login-username" autocomplete="username" required>
        </div>
        <div class="auth-field">
          <label for="login-password">Mật khẩu</label>
          <input type="password" id="login-password" autocomplete="current-password" required>
        </div>
        <div class="auth-error" id="login-error" role="alert" aria-live="assertive"></div>
        <button type="submit" class="auth-submit-btn">ĐĂNG NHẬP</button>
        <div class="auth-switch">Chưa có tài khoản? <a href="#" id="show-register">Đăng ký ngay</a></div>
      </form>

      <form id="register-form" class="auth-form" aria-hidden="true">
        <div class="auth-field">
          <label for="register-username">Tên đăng nhập</label>
          <input type="text" id="register-username" autocomplete="username" required>
        </div>
        <div class="auth-field">
          <label for="register-password">Mật khẩu</label>
          <input type="password" id="register-password" autocomplete="new-password" required>
        </div>
        <div class="auth-field">
          <label for="register-password2">Nhập lại mật khẩu</label>
          <input type="password" id="register-password2" autocomplete="new-password" required>
        </div>
        <div class="auth-error" id="register-error" role="alert" aria-live="assertive"></div>
        <button type="submit" class="auth-submit-btn">ĐĂNG KÝ</button>
        <div class="auth-switch">Đã có tài khoản? <a href="#" id="show-login">Đăng nhập</a></div>
      </form>
    </div>
  </div>

  <main id="game-root" tabindex="-1" role="main">
    <header id="header">
      <div>
        <div id="score-label">ĐIỂM SỐ</div>
        <div id="score-box" aria-live="polite">0</div>
        <div id="best-box">Kỷ lục: 0</div>
      </div>
      <div style="text-align:center">
        <div id="combo-box" aria-live="polite"></div>
        <div id="level-box">Cấp độ 1</div>
      </div>
      <div style="text-align:right">
        <div id="mode-badge">BÌNH THƯỜNG</div>
        <div style="font-size:10px;color:#555;margin-top:4px">ChromaBlast</div>
      </div>
      <div id="game-controls" style="display:flex;gap:6px;align-items:center;">
        <button id="admin-btn" type="button" title="Bảng admin - chọn map ẩn" style="display:none;">🛠️ ADMIN</button>
        <button id="account-btn" type="button" title="Tài khoản">👤</button>
        <button id="mute-btn" type="button" title="Tắt/bật âm thanh" data-muted="false" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:#fff;font-size:16px;width:32px;height:32px;cursor:pointer;">🔊</button>
        <button id="pause-btn" type="button" title="Tạm dừng" data-paused="false" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:#fff;font-size:16px;width:32px;height:32px;cursor:pointer;">⏸</button>
      </div>
    </header>

    <div id="grid-wrap">
      <div id="grid" role="application" aria-label="Bàn chơi">
        <!-- grid cells will be injected by game logic -->
      </div>

      <div id="secret-grid" aria-hidden="true"></div>

      <div id="timer-bar-wrap" aria-hidden="true"><div id="timer-bar"></div></div>

      <div id="pieces-area" aria-hidden="false"></div>

      <div id="combo-border-sparks" aria-hidden="true"></div>
      <div id="sc-fx" aria-hidden="true"></div>
      <div id="combo-flash" aria-hidden="true"></div>
      <div id="unlock-overlay" aria-hidden="true"></div>
      <div id="game-over-overlay" aria-hidden="true"></div>

      <div id="drag-ghost" aria-hidden="true"></div>
    </div>

    <div id="status-bar">
      <div id="hint-bar">Sẵn sàng</div>
      <div id="secret-streak-bar" aria-hidden="true"></div>
    </div>

    <div id="account-panel" class="admin-card" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="admin-title"><span>👤 Tài khoản</span><button class="admin-close" id="account-close-btn" aria-label="Đóng">✕</button></div>
      <div class="account-user">Đang đăng nhập: <b id="account-username-box">—</b></div>

      <div class="account-section-title">🔑 Đổi mật khẩu</div>
      <form id="change-password-form">
        <div class="auth-field">
          <label for="cp-old">Mật khẩu hiện tại</label>
          <input type="password" id="cp-old" autocomplete="current-password" required>
        </div>
        <div class="auth-field">
          <label for="cp-new">Mật khẩu mới</label>
          <input type="password" id="cp-new" autocomplete="new-password" required>
        </div>
        <div class="auth-field">
          <label for="cp-new2">Nhập lại mật khẩu mới</label>
          <input type="password" id="cp-new2" autocomplete="new-password" required>
        </div>
        <div class="account-msg" id="cp-msg" aria-live="polite"></div>
        <button type="submit" class="auth-submit-btn">CẬP NHẬT MẬT KHẨU</button>
      </form>

      <hr class="account-divider">
      <button class="logout-btn" id="logout-btn" type="button">🚪 Đăng xuất</button>
    </div>

  </main>

<script defer src="js/app.js"></script>
</body>
</html>
