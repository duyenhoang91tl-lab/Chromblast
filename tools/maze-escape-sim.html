<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Thoát khỏi mê cung — mô phỏng Map 19</title>
<style>
  :root{ --bg:#0e1610; --panel:#1a2a1c; --ink:#eaf5e8; --accent:#ffd76a; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
    background:radial-gradient(1200px 600px at 50% -10%, #243828, var(--bg));
    color:var(--ink); font-family:Nunito, system-ui, sans-serif; padding:16px;
  }
  h1{ font-size:1.25rem; margin:8px 0 4px; color:var(--accent); text-align:center; }
  p{ margin:0 0 12px; opacity:.85; font-size:.9rem; text-align:center; max-width:420px; line-height:1.4; }
  .wrap{
    background:var(--panel); border-radius:18px; padding:12px; box-shadow:0 12px 40px rgba(0,0,0,.45);
    border:1px solid rgba(255,255,220,.12);
  }
  canvas{ display:block; width:min(360px,92vw); height:auto; touch-action:none; border-radius:12px; background:#152018; }
  .bar{ display:flex; gap:8px; justify-content:center; margin-top:12px; flex-wrap:wrap; }
  button{
    border:none; border-radius:999px; padding:10px 18px; font-weight:800; cursor:pointer;
    background:linear-gradient(180deg,#ffe08a,#e0b84a); color:#1a1400;
  }
  button.ghost{ background:rgba(255,255,255,.1); color:#fff; }
  .hint{ font-size:.8rem; opacity:.7; margin-top:10px; text-align:center; }
</style>
</head>
<body>
  <h1>🌀 Thoát khỏi mê cung</h1>
  <p>Mô phỏng Map ẩn 19 — mê cung nhỏ, đường rộng, cỏ dày che tường. Dẫn Samoyed tới 🚪. Vuốt hoặc phím mũi tên.</p>
  <div class="wrap">
    <canvas id="c" width="720" height="920"></canvas>
  </div>
  <div class="bar">
    <button type="button" id="btn-new">Mê cung mới</button>
    <button type="button" class="ghost" id="btn-reset">Về ô đầu</button>
  </div>
  <div class="hint">Ô cỏ: tường bị che — va vào tường cụt sẽ đánh dấu ✕ để nhớ đường.</div>
<script>
(function(){
  const cv=document.getElementById('c');
  const ctx=cv.getContext('2d');
  let state=null, raf=0;

  function generateMaze(cols,rows){
    const cells=Array.from({length:rows},()=>Array.from({length:cols},()=>({
      visited:false, walls:[true,true,true,true], grass:false
    })));
    const DIRS=[[-1,0,0,2],[0,1,1,3],[1,0,2,0],[0,-1,3,1]];
    function carve(r,c){
      cells[r][c].visited=true;
      const dirs=[...DIRS].sort(()=>Math.random()-0.5);
      for(const [dr,dc,w1,w2] of dirs){
        const nr=r+dr, nc=c+dc;
        if(nr>=0&&nr<rows&&nc>=0&&nc<cols&&!cells[nr][nc].visited){
          cells[r][c].walls[w1]=false;
          cells[nr][nc].walls[w2]=false;
          carve(nr,nc);
        }
      }
    }
    carve(0,0);
    return cells;
  }

  function plantGrass(cells,cols,rows){
    const blocked=new Set(['0,0',(rows-1)+','+(cols-1)]);
    const seeds=Math.max(3, Math.floor(cols*rows*0.08));
    for(let s=0;s<seeds;s++){
      let r,c;
      do{ r=(Math.random()*rows)|0; c=(Math.random()*cols)|0; }while(blocked.has(r+','+c));
      const radius=1+(Math.random()*2)|0;
      for(let dr=-radius;dr<=radius;dr++){
        for(let dc=-radius;dc<=radius;dc++){
          if(Math.abs(dr)+Math.abs(dc)>radius+1) continue;
          const nr=r+dr, nc=c+dc;
          if(nr<0||nr>=rows||nc<0||nc>=cols||blocked.has(nr+','+nc)) continue;
          if(Math.random()<0.82) cells[nr][nc].grass=true;
        }
      }
    }
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      if(!blocked.has(r+','+c) && !cells[r][c].grass && Math.random()<0.28) cells[r][c].grass=true;
    }
  }

  function init(){
    const W=360, H=460, cols=9, rows=11;
    const cells=generateMaze(cols,rows);
    plantGrass(cells,cols,rows);
    const cellW=Math.floor((W-16)/cols);
    const cellH=Math.floor((H-56)/rows);
    state={
      W,H,cols,rows,cells,cellW,cellH,
      offX:(W-cols*cellW)/2, offY:48,
      dog:{r:0,c:0}, timeLeft:90, tick:0,
      won:false, over:false,
      revealed:Object.create(null),
      visited:{'0,0':true},
      touchX:null, touchY:null
    };
  }

  function tryMove(dr,dc){
    const s=state; if(!s||s.won||s.over) return;
    const wallMap={'-10':0,'01':1,'10':2,'0-1':3};
    const wi=wallMap[''+dr+dc]; if(wi===undefined) return;
    const here=s.cells[s.dog.r][s.dog.c];
    if(!here.walls[wi]){
      s.dog.r+=dr; s.dog.c+=dc;
      s.visited[s.dog.r+','+s.dog.c]=true;
      if(s.dog.r===s.rows-1 && s.dog.c===s.cols-1) s.won=true;
    } else if(here.grass){
      s.revealed[s.dog.r+','+s.dog.c+','+wi]=true;
    }
  }

  function drawBg(W,H,t){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#1a2f22'); g.addColorStop(0.45,'#243828'); g.addColorStop(1,'#152018');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    for(let i=0;i<18;i++){
      const x=(Math.sin(i*17.3+t*0.4)*0.5+0.5)*W;
      const y=(Math.cos(i*11.1+t*0.35)*0.5+0.5)*H;
      const rg=ctx.createRadialGradient(x,y,0,x,y,40+i%20);
      rg.addColorStop(0,'rgba(180,220,160,0.06)'); rg.addColorStop(1,'rgba(180,220,160,0)');
      ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(x,y,50,0,Math.PI*2); ctx.fill();
    }
  }

  function drawGrass(x,y,w,h,seed,t){
    ctx.save();
    ctx.beginPath(); ctx.rect(x+1,y+1,w-2,h-2); ctx.clip();
    ctx.fillStyle='#2a4a28'; ctx.fillRect(x,y,w,h);
    const blades=Math.max(14, ((w*h)/18)|0);
    for(let i=0;i<blades;i++){
      const sx=x+2+((seed*37+i*17)%Math.max(1,(w-4)));
      const base=y+h-2;
      const len=h*0.45+((seed+i*13)%10);
      const sway=Math.sin(t*2.2+i*0.7+seed)*2.2;
      ctx.strokeStyle=i%3===0?'#3d7a3a':(i%3===1?'#4a9a44':'#2f6b32');
      ctx.lineWidth=1.4;
      ctx.beginPath();
      ctx.moveTo(sx,base);
      ctx.quadraticCurveTo(sx+sway, base-len*0.55, sx+sway*1.4, base-len);
      ctx.stroke();
    }
    ctx.fillStyle='rgba(10,30,12,0.38)'; ctx.fillRect(x,y,w,h);
    ctx.restore();
  }

  function drawSamoyed(cx,cy,size,t){
    const s=size*0.48;
    ctx.save(); ctx.translate(cx, cy+Math.sin(t*3)*1.2);
    ctx.fillStyle='rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(0,s*0.85,s*0.55,s*0.18,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#f7f7f4';
    ctx.beginPath(); ctx.ellipse(0,s*0.15,s*0.62,s*0.55,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0,-s*0.35,s*0.48,s*0.45,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#efe8e0';
    ctx.beginPath(); ctx.ellipse(-s*0.38,-s*0.7,s*0.16,s*0.22,-0.4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( s*0.38,-s*0.7,s*0.16,s*0.22, 0.4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#222';
    ctx.beginPath(); ctx.arc(-s*0.16,-s*0.38,s*0.07,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc( s*0.16,-s*0.38,s*0.07,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-s*0.13,-s*0.41,s*0.025,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc( s*0.19,-s*0.41,s*0.025,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#333';
    ctx.beginPath(); ctx.ellipse(0,-s*0.22,s*0.1,s*0.07,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,160,170,0.35)';
    ctx.beginPath(); ctx.ellipse(-s*0.28,-s*0.2,s*0.1,s*0.06,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( s*0.28,-s*0.2,s*0.1,s*0.06,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function loop(){
    const s=state; if(!s) return;
    ctx.setTransform(2,0,0,2,0,0);
    const W=s.W, H=s.H, t=Date.now()*0.001;
    if(!s.won && !s.over){
      s.tick++;
      if(s.tick>=60){ s.tick=0; s.timeLeft--; if(s.timeLeft<=0) s.over=true; }
    }
    drawBg(W,H,t);
    ctx.fillStyle='#fff'; ctx.font='bold 13px system-ui';
    ctx.textAlign='left'; ctx.fillText('⏱ '+s.timeLeft+'s',12,22);
    ctx.textAlign='right'; ctx.fillText('🌿 Cỏ che đường',W-12,22);

    for(let r=0;r<s.rows;r++){
      for(let c=0;c<s.cols;c++){
        const x=s.offX+c*s.cellW, y=s.offY+r*s.cellH;
        if(s.cells[r][c].grass) drawGrass(x,y,s.cellW,s.cellH,r*97+c*13,t);
        else {
          ctx.fillStyle=(r+c)%2===0?'#3d5c3a':'#355434';
          ctx.fillRect(x+1,y+1,s.cellW-2,s.cellH-2);
        }
      }
    }

    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    for(let r=0;r<s.rows;r++){
      for(let c=0;c<s.cols;c++){
        const cell=s.cells[r][c], x=s.offX+c*s.cellW, y=s.offY+r*s.cellH, w=cell.walls;
        for(let wi=0;wi<4;wi++){
          if(!w[wi]) continue;
          if(cell.grass && !s.revealed[r+','+c+','+wi]) continue;
          if(wi===0){ ctx.moveTo(x+1,y); ctx.lineTo(x+s.cellW-1,y); }
          else if(wi===1){ ctx.moveTo(x+s.cellW,y+1); ctx.lineTo(x+s.cellW,y+s.cellH-1); }
          else if(wi===2){ ctx.moveTo(x+1,y+s.cellH); ctx.lineTo(x+s.cellW-1,y+s.cellH); }
          else { ctx.moveTo(x,y+1); ctx.lineTo(x,y+s.cellH-1); }
        }
      }
    }
    ctx.strokeStyle='#e8d9a8'; ctx.lineWidth=3.2; ctx.stroke();
    ctx.strokeStyle='rgba(90,70,30,0.55)'; ctx.lineWidth=1.4; ctx.stroke();

    ctx.strokeStyle='rgba(255,120,90,0.9)'; ctx.lineWidth=1.5;
    for(let r=0;r<s.rows;r++) for(let c=0;c<s.cols;c++){
      if(!s.cells[r][c].grass) continue;
      const x=s.offX+c*s.cellW, y=s.offY+r*s.cellH;
      for(let wi=0;wi<4;wi++){
        if(!s.revealed[r+','+c+','+wi]) continue;
        let mx=x+s.cellW/2, my=y+s.cellH/2;
        if(wi===0) my=y+5; if(wi===1) mx=x+s.cellW-5; if(wi===2) my=y+s.cellH-5; if(wi===3) mx=x+5;
        ctx.beginPath();
        ctx.moveTo(mx-3,my-3); ctx.lineTo(mx+3,my+3);
        ctx.moveTo(mx+3,my-3); ctx.lineTo(mx-3,my+3);
        ctx.stroke();
      }
    }

    const ex=s.offX+(s.cols-1)*s.cellW+s.cellW/2, ey=s.offY+(s.rows-1)*s.cellH+s.cellH/2;
    const glow=0.45+0.35*Math.sin(t*3);
    const eg=ctx.createRadialGradient(ex,ey,2,ex,ey,s.cellW*0.95);
    eg.addColorStop(0,`rgba(255,220,90,${0.35+glow*0.3})`); eg.addColorStop(1,'rgba(255,220,90,0)');
    ctx.fillStyle=eg; ctx.beginPath(); ctx.arc(ex,ey,s.cellW*0.95,0,Math.PI*2); ctx.fill();
    ctx.font=(Math.min(s.cellW,s.cellH)*0.72)+'px serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🚪',ex,ey);

    const dx=s.offX+s.dog.c*s.cellW+s.cellW/2, dy=s.offY+s.dog.r*s.cellH+s.cellH/2;
    drawSamoyed(dx,dy,Math.min(s.cellW,s.cellH),t);

    if(s.won || s.over){
      ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle=s.won?'#ffd76a':'#ff8a8a';
      ctx.font='bold 22px system-ui'; ctx.textAlign='center';
      ctx.fillText(s.won?'🌀 THOÁT KHỎI MÊ CUNG!':'⏰ HẾT GIỜ', W/2, H/2);
      ctx.fillStyle='#cde8c8'; ctx.font='14px system-ui';
      ctx.fillText('Bấm “Mê cung mới” để chơi lại', W/2, H/2+28);
    }
    raf=requestAnimationFrame(loop);
  }

  window.addEventListener('keydown',e=>{
    const m={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]};
    if(m[e.key]){ e.preventDefault(); tryMove(...m[e.key]); }
  });
  cv.addEventListener('touchstart',e=>{ e.preventDefault(); state.touchX=e.touches[0].clientX; state.touchY=e.touches[0].clientY; },{passive:false});
  cv.addEventListener('touchend',e=>{
    e.preventDefault();
    if(state.touchX==null) return;
    const dx=e.changedTouches[0].clientX-state.touchX;
    const dy=e.changedTouches[0].clientY-state.touchY;
    if(Math.abs(dx)>Math.abs(dy)) tryMove(0,dx>0?1:-1); else tryMove(dy>0?1:-1,0);
    state.touchX=null; state.touchY=null;
  },{passive:false});

  document.getElementById('btn-new').onclick=()=>{ init(); };
  document.getElementById('btn-reset').onclick=()=>{ if(!state) return; state.dog={r:0,c:0}; state.won=false; state.over=false; state.timeLeft=90; };

  init();
  cancelAnimationFrame(raf);
  loop();
})();
</script>
</body>
</html>
